.8", "sourcePage": 5, "attachmentPage": 4, "printedPage": 141, "text": "Which of the following correctly describes an organism’s ability to withstand a change in environmental conditions", "choices": [{"label": "A", "text": "Growth"}, {"label": "B", "text": "Homeostasis"}, {"label": "C", "text": "Response"}, {"label": "D", "text": "Adaptation"}], "answer": "D", "verified": true, "answerSource": "Circled option in the supplied PDF image", "keywords": ["withstand a change", "environmental conditions", "adaptation"], "keywordNotes": ["Adaptation describes an organism’s ability to remain suited to changing environmental conditions."], "why": ["The source circles Adaptation."], "steps": ["Focus on long-term suitability to the environment.", "Separate this from a short reaction or internal regulation.", "Select D."], "visual": null, "flags": []}, {"id": "p1-zama-worked-1-9", "part": "Part 1", "group": "Zama", "kind": "Worked example", "label": "1.9", "sourcePage": 5, "attachmentPage": 4, "printedPage": 141, "text": "Maintenance of an organism’s internal conditions, essential for survival:", "choices": [{"label": "A", "text": "Adaptation"}, {"label": "B", "text": "Response"}, {"label": "C", "text": "Homeostasis"}, {"label": "D", "text": "Growth"}], "answer": "C", "verified": true, "answerSource": "Circled option in the supplied PDF image", "keywords": ["maintenance", "internal conditions", "survival", "homeostasis"], "keywordNotes": ["Homeostasis is the maintenance of stable internal conditions."], "why": ["The definition matches the circled option Homeostasis."], "steps": ["Look for internal rather than external conditions.", "Match maintenance and survival with the named concept.", "Select C."], "visual": null, "flags": []}, {"id": "p1-zama-worked-1-10", "part": "Part 1", "group": "Zama", "kind": "Worked example", "label": "1.10", "sourcePage": 5, "attachmentPage": 4, "printedPage": 141, "text": "The basic functional unit of a living organism is", "choices": [{"label": "A", "text": "Tissue"}, {"label": "B", "text": "Cell"}, {"label": "C", "text": "Organ System"}, {"label": "D", "text": "Organ"}], "answer": "B", "verified": true, "answerSource": "Circled option in the supplied PDF image", "keywords": ["basic functional unit", "living organism", "cell"], "keywordNotes": ["The cell is the smallest listed unit that performs life functions."], "why": ["Cell is circled in the source image."], "steps": ["Look for the most basic level in the choices.", "Compare cell with tissue, organ, and organ system.", "Select B."], "visual": null, "flags": []}, {"id": "p1-zama-worked-1-11", "part": "Part 1", "group": "Zama", "kind": "Worked example", "label": "1.11", "sourcePage": 6, "attachmentPage": 5, "printedPage": 142, "text": "As you were going through a group of plants, an odd-looking plant caught your attention. Which of the following steps would come first if you were to conduct a scientific study", "choices": [{"label": "A", "text": "Conclusion"}, {"label": "B", "text": "Observation"}, {"label": "C", "text": "Hypothesis"}, {"label": "D", "text": "Experiment"}], "answer": "B", "verified": true, "answerSource": "Circled option in the supplied PDF image", "keywords": ["come first", "caught your attention", "observation"], "keywordNotes": ["Noticing the odd-looking plant is an observation, the first step shown by the source."], "why": ["Observation is circled as B."], "steps": ["Start with what is noticed.", "Do not jump to a conclusion or test yet.", "Select B."], "visual": null, "flags": []}, {"id": "p1-zama-worked-1-12", "part": "Part 1", "group": "Zama", "kind": "Worked example", "label": "1.12", "sourcePage": 6, "attachmentPage": 5, "printedPage": 142, "text": "In scientific research, which step follows after a scientist noticed a new phenomenon in nature", "choices": [{"label": "A", "text": "Hypothesis"}, {"label": "B", "text": "Conclusion"}, {"label": "C", "text": "Asking a question"}, {"label": "D", "text": "Data Analysis"}], "answer": "A <script>
const STORAGE_KEY = 'biolearn-study-v1';

const emptyState = () => ({
  completed: [],
  studiedOrder: [],
  currentIndex: 0,
  bookmarks: [],
  incorrectAnswers: {},
  revisionTests: [],
  revisionAttempts: {}
});

let dataset;
let questions = [];
let state = loadState();
let view = 'home';
let learnIndex = 0;
let learnSession = { selected: null, submitted: false, revealed: false };
let allQuery = '';
let allFilter = 'all';
let activeRevision = null;

function loadState() {
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    return { ...emptyState(), ...(stored || {}) };
  } catch {
    return emptyState();
  }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function currentQuestion() {
  return questions[learnIndex] || questions[0];
}

function isBookmarked(id) {
  return state.bookmarks.includes(id);
}

function nextIncompleteIndex() {
  const next = questions.findIndex((q) => !state.completed.includes(q.id));
  return next >= 0 ? next : 0;
}

function showToast(message) {
  const toast = document.querySelector('#toast');
  if (!toast) return;
  toast.textContent = message;
  toast.classList.add('show');
  window.clearTimeout(showToast.timer);
  showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 2300);
}

function setView(nextView) {
  view = nextView;
  if (view === 'learn' && !learnSession) learnSession = { selected: null, submitted: false, revealed: false };
  render();
}

function toggleBookmark(id) {
  state.bookmarks = isBookmarked(id)
    ? state.bookmarks.filter((bookmarkId) => bookmarkId !== id)
    : [...state.bookmarks, id];
  saveState();
  showToast(isBookmarked(id) ? 'Bookmarked for revision.' : 'Bookmark removed.');
  render();
}

function maybeCreateRevisionBatch() {
  const studied = state.studiedOrder.length;
  const regularBatch = studied >= 10 && studied % 10 === 0;
  const finalBatch = studied === questions.length && studied % 10 !== 0;
  if (!regularBatch && !finalBatch) return;
  const batchIds = finalBatch
    ? state.studiedOrder.slice(studied - (studied % 10 || 10))
    : state.studiedOrder.slice(studied - 10);
  if (!batchIds.length) return;
  const alreadyExists = state.revisionTests.some((test) => test.questionIds.join('|') === batchIds.join('|'));
  if (alreadyExists) return;
  const number = state.revisionTests.filter((test) => test.questionIds.length === 10).length + 1;
  state.revisionTests.push({
    id: `revision-${Date.now()}`,
    label: finalBatch ? 'Final Revision Test' : `Revision Test ${number}`,
    questionIds: batchIds,
    createdAt: new Date().toISOString()
  });
  saveState();
  showToast(finalBatch ? 'Final revision test unlocked.' : `Revision Test ${number} unlocked.`);
}

function markStudied(question, selected = null) {
  if (!state.completed.includes(question.id)) {
    state.completed.push(question.id);
    state.studiedOrder.push(question.id);
    maybeCreateRevisionBatch();
  }
  if (selected && selected !== question.answer) {
    state.incorrectAnswers[question.id] = { selected, answer: question.answer };
  }
  saveState();
}

function renderTop() {
  const titles = {
    home: ['STUDY DESK / HOME', 'Understand the clue, then choose.'],
    learn: ['STUDY DESK / LEARN', 'One question. One useful clue.'],
    revision: ['STUDY DESK / REVISION', 'Retrieve the exact questions you already studied.'],
    all: ['STUDY DESK / QUESTION BANK', 'Browse the source collection without losing the thread.']
  };
  const [kicker, title] = titles[view];
  document.querySelector('#section-kicker').textContent = kicker;
  document.querySelector('#page-title').textContent = title;
  const progress = questions.length ? (state.completed.length / questions.length) * 100 : 0;
  document.querySelector('#top-progress-bar').style.width = `${progress}%`;
  document.querySelector('#top-progress-label').textContent = `${state.completed.length} / ${questions.length} studied`;
  document.querySelector('#revision-count').textContent = state.revisionTests.length;
  document.querySelectorAll('.nav-item').forEach((item) => item.classList.toggle('active', item.dataset.view === view));
}

function renderHome() {
  const completed = state.completed.length;
  const remaining = Math.max(questions.length - completed, 0);
  const flagged = questions.filter((q) => q.flags?.length).length;
  const avg = Object.values(state.revisionAttempts).flat().length
    ? Math.round(Object.values(state.revisionAttempts).flat().reduce((sum, attempt) => sum + attempt.score, 0) / Object.values(state.revisionAttempts).flat().length)
    : null;
  const parts = [...new Set(questions.map((q) => q.part))];
  return `
    <section class="hero-grid">
      <article class="card hero-card">
        <div class="kicker">SOURCE-GROUNDED STUDY DESK</div>
        <h2>${completed ? `You’ve studied ${completed} questions.` : 'Start with one clean clue.'}</h2>
        <p>Work through Part 1, Part 2, or Part 9 as separate collections. Answers stay hidden until you act, then the keywords explain why the source answer fits.</p>
        <div class="button-row">
          <button class="btn btn-primary" data-action="continue-learning">${completed ? 'Continue Learning' : 'Start Learning'} <span aria-hidden="true">→</span></button>
          <button class="btn btn-secondary" data-view="revision">Open Revision</button>
        </div>
      </article>
      <div class="stat-stack">
        <article class="card stat-card"><div class="stat-label">COMPLETED</div><div class="stat-value">${completed}<small> / ${questions.length}</small></div></article>
        <article class="card stat-card"><div class="stat-label">TO REVISIT</div><div class="stat-value">${Object.keys(state.incorrectAnswers).length}<small> answers</small></div></article>
        <article class="card stat-card"><div class="stat-label">REVISION AVERAGE</div><div class="stat-value">${avg === null ? '—' : `${avg}%`}</div></article>
      </div>
    </section>

    <div class="section-row"><div><h2>Collection map</h2><p class="section-note">${remaining} question${remaining === 1 ? '' : 's'} left · ${flagged} flagged source note${flagged === 1 ? '' : 's'}</p></div><span class="badge">PARTS 1 / 2 / 9 · ${questions.length} VISIBLE</span></div>
    <section class="module-grid">
      ${parts.map((part, index) => {
        const partQuestions = questions.filter((q) => q.part === part);
        const partCompleted = partQuestions.filter((q) => state.completed.includes(q.id)).length;
        const percent = Math.round((partCompleted / partQuestions.length) * 100);
        return `<article class="card module-card"><div class="module-num">0${index + 1} / ${escapeHtml(part.toUpperCase())}</div><h3>${escapeHtml(part)} questions</h3><p>${partQuestions.length} source occurrences · ${partCompleted} completed.</p><div class="progress-track"><span style="width:${percent}%"></span></div></article>`;
      }).join('')}
    </section>

    <div class="section-row"><div><h2>How to use this desk</h2><p class="section-note">Retrieval first, explanation second.</p></div></div>
    <section class="card teaching-card"><ul><li>Choose an answer before opening the key.</li><li>Use the teal keywords to name the clue.</li><li>Every 10 newly studied questions becomes an exact revision test.</li><li>Use bookmarks for anything you want to meet again.</li></ul></section>
  `;
}

function renderQuestionCard(question, isRevision = false) {
  const selected = isRevision ? activeRevision?.selected : learnSession.selected;
  const submitted = isRevision ? activeRevision?.submitted : learnSession.submitted;
  const revealed = isRevision ? false : learnSession.revealed;
  const answerText = question.choices.find((choice) => choice.label === question.answer)?.text || 'Verified answer text unavailable';
  const result = submitted && selected ? selected === question.answer : null;
  const choiceHtml = question.choices.map((choice) => {
    const missing = choice.text === null;
    const checked = selected === choice.label ? 'checked' : '';
    const disabled = submitted ? 'disabled' : '';
    const label = missing ? 'Choice text unavailable in source PDF' : choice.text;
    return `<label class="choice ${missing ? 'missing' : ''}"><input type="radio" name="${escapeHtml(isRevision ? `revision-${question.id}` : question.id)}" value="${choice.label}" ${checked} ${disabled} /><span class="choice-letter">${choice.label}</span><span class="choice-text">${escapeHtml(label)}</span></label>`;
  }).join('');
  const feedback = submitted && selected
    ? `<div class="feedback ${result ? 'correct' : 'wrong'}"><h3>${result ? 'Correct — follow the clue.' : 'Not quite — use the keyword.'}</h3><p>${result ? escapeHtml(question.why[0]) : `Your choice was ${escapeHtml(selected)}. The verified answer is ${escapeHtml(question.answer)} — ${escapeHtml(question.why[0])}`}</p></div>`
    : revealed
      ? `<div class="feedback"><h3>Verified answer: ${escapeHtml(question.answer)} · ${escapeHtml(answerText)}</h3><p>${escapeHtml(question.why[0])}</p></div>`
      : '';
  const image = question.visual ? `<img class="source-image" src="${question.visual}" alt="Source visual for ${escapeHtml(question.label)}" />` : '';
  const flags = question.flags?.length ? `<div class="flag">${question.flags.map(escapeHtml).join('<br />')}</div>` : '';
  return `
    <article class="card question-card">
      <div class="question-top"><div><div class="question-id">${escapeHtml(question.part.toUpperCase())} / ${escapeHtml(question.group.toUpperCase())} / ${escapeHtml(question.kind.toUpperCase())} / ${escapeHtml(question.label)}</div></div><div class="source-ref">Source page ${escapeHtml(question.sourcePage)}${question.printedPage ? ` · Printed page ${escapeHtml(question.printedPage)}` : ''}<br />Attachment page ${escapeHtml(question.attachmentPage)}</div></div>
      <p class="question-text">${escapeHtml(question.text)}</p>
      ${image}
      <div class="choice-list">${choiceHtml}</div>
      ${flags}
      ${feedback}
      <div class="question-actions">
        <div class="action-group">
          ${isRevision ? '' : `<button class="btn btn-ghost bookmark-btn" data-action="toggle-bookmark" data-id="${question.id}">${isBookmarked(question.id) ? '★ Bookmarked' : '☆ Bookmark'}</button>`}
          ${isRevision ? '' : (!submitted && !revealed ? '<button class="btn btn-secondary" data-action="show-answer">Show Answer</button>' : '')}
        </div>
        <div class="action-group">
          ${isRevision ? `<button class="btn btn-primary" data-action="submit-revision">${activeRevision.index === activeRevision.questionIds.length - 1 ? 'Finish Test' : 'Check & Next'} →</button>` : (!submitted && !revealed ? '<button class="btn btn-primary" data-action="submit-answer">Check Answer →</button>' : '<button class="btn btn-primary" data-action="next-question">Next Question →</button>')}
        </div>
      </div>
    </article>
  `;
}

function renderLearn() {
  const question = currentQuestion();
  const position = learnIndex + 1;
  return `
    <div class="learn-layout">
      <div>
        <div class="section-row" style="margin-top:0"><div><h2>Question ${position} <span class="section-note">of ${questions.length}</span></h2><p class="section-note">${state.completed.includes(question.id) ? 'Already studied — use this pass to retrieve it again.' : 'New to your study log.'}</p></div><span class="badge">${escapeHtml(question.group)} · ${escapeHtml(question.kind)}</span></div>
        ${renderQuestionCard(question)}
      </div>
      <aside class="teaching-rail">
        <article class="card teaching-card"><h3>Keywords</h3><p>${question.keywords.map((keyword) => `<span class="badge">${escapeHtml(keyword)}</span>`).join(' ')}</p><ul>${question.keywordNotes.map((note) => `<li>${escapeHtml(note)}</li>`).join('')}</ul></article>
        <article class="card teaching-card"><h3>Solving steps</h3><ol>${question.steps.map((step) => `<li>${escapeHtml(step)}</li>`).join('')}</ol></article>
        <article class="card teaching-card"><h3>Source evidence</h3><p>Answer: <strong>${escapeHtml(question.answer)}</strong><br />${escapeHtml(question.answerSource)}</p><p>Source page ${escapeHtml(question.sourcePage)}${question.printedPage ? ` · printed ${escapeHtml(question.printedPage)}` : ''}.</p></article>
      </aside>
    </div>
  `;
}

function renderRevisionTest() {
  const test = state.revisionTests.find((item) => item.id === activeRevision.testId);
  if (!test) { activeRevision = null; return renderRevision(); }
  const question = questions.find((item) => item.id === test.questionIds[activeRevision.index]);
  return `<div class="test-layout"><div class="section-row" style="margin-top:0"><div><h2>${escapeHtml(test.label)}</h2><p class="section-note">Exact source questions · no replacements</p></div><span class="badge">${activeRevision.index + 1} / ${test.questionIds.length}</span></div><div class="test-progress"><div class="progress-track"><span style="width:${((activeRevision.index + (activeRevision.submitted ? 1 : 0)) / test.questionIds.length) * 100}%"></span></div></div>${renderQuestionCard(question, true)}</div>`;
}

function renderRevisionResult() {
  const test = state.revisionTests.find((item) => item.id === activeRevision.testId);
  const { score, total, answers } = activeRevision.result;
  const wrong = test.questionIds.map((id) => questions.find((q) => q.id === id)).filter((q) => answers[q.id] !== q.answer);
  const percent = Math.round((score / total) * 100);
  return `<div class="test-layout"><article class="card test-result"><div class="score-ring" style="--score:${percent}%"><strong>${percent}%</strong></div><h2>${escapeHtml(test.label)} complete</h2><p class="section-note">${score} correct out of ${total}. Your score and incorrect answers are saved locally.</p><div class="button-row" style="justify-content:center"><button class="btn btn-primary" data-action="retry-revision">Retry Test</button><button class="btn btn-secondary" data-action="back-to-revision">Back to Revision</button></div>${wrong.length ? `<div class="incorrect-list"><h3>Review these clues</h3>${wrong.map((q) => `<div class="incorrect-item"><strong>${escapeHtml(q.label)} · ${escapeHtml(q.text)}</strong><span>Your answer: ${escapeHtml(answers[q.id] || 'none')} · Verified: ${escapeHtml(q.answer)}. ${escapeHtml(q.why[0])}</span></div>`).join('')}</div>` : '<div class="feedback correct" style="text-align:left;margin-top:24px"><h3>Clean retrieval.</h3><p>Every answer matched the verified source key.</p></div>'}</article></div>`;
}

function renderRevision() {
  if (activeRevision?.done) return renderRevisionResult();
  if (activeRevision) return renderRevisionTest();
  if (!state.revisionTests.length) {
    return `<article class="card empty-state"><div class="empty-orbit"></div><h2>Your first revision test unlocks at 10.</h2><p>Study ten questions in Learn. BioLearn will reuse those exact question records here and score your retrieval.</p><button class="btn btn-primary" data-action="continue-learning">Continue Learning →</button></article>`;
  }
  return `<div class="section-row" style="margin-top:0"><div><h2>Revision shelf</h2><p class="section-note">Each test is a saved block of exact question IDs from your study log.</p></div><span class="badge">${state.revisionTests.length} TEST${state.revisionTests.length === 1 ? '' : 'S'}</span></div>${state.revisionTests.map((test) => {
    const attempts = state.revisionAttempts[test.id] || [];
    const latest = attempts.at(-1);
    return `<article class="card revision-card"><div class="revision-head"><div><h3>${escapeHtml(test.label)}</h3><p>${test.questionIds.length} exact questions · ${latest ? `Latest score ${latest.score}/${latest.total}` : 'Not attempted yet'}</p></div><div class="button-row" style="margin-top:0"><span class="badge">${test.questionIds.length}/10${test.questionIds.length < 10 ? ' FINAL' : ''}</span><button class="btn btn-primary" data-action="start-revision" data-id="${test.id}">${latest ? 'Retry' : 'Start Test'} →</button></div></div></article>`;
  }).join('')}`;
}

function renderAllQuestions() {
  const filtered = questions.filter((q) => {
    const haystack = [q.label, q.group, q.kind, q.text, ...q.keywords, ...q.choices.map((c) => c.text || '')].join(' ').toLowerCase();
    const matchesQuery = haystack.includes(allQuery.toLowerCase());
    const matchesFilter = allFilter === 'all' || q.part === allFilter || q.group === allFilter || (allFilter === 'bookmarked' && isBookmarked(q.id));
    return matchesQuery && matchesFilter;
  });
  return `<div class="section-row" style="margin-top:0"><div><h2>All Questions</h2><p class="section-note">${filtered.length} matching source records · search never changes the question data.</p></div><span class="badge">${questions.length} TOTAL</span></div><div class="search-row"><input class="search-input" id="all-search" placeholder="Search question text, clue, or source label" value="${escapeHtml(allQuery)}" /><select class="filter-select" id="all-filter"><option value="all" ${allFilter === 'all' ? 'selected' : ''}>All sections</option><option value="Part 1" ${allFilter === 'Part 1' ? 'selected' : ''}>Part 1</option><option value="Part 2" ${allFilter === 'Part 2' ? 'selected' : ''}>Part 2</option><option value="Part 9" ${allFilter === 'Part 9' ? 'selected' : ''}>Part 9</option><option value="Zama" ${allFilter === 'Zama' ? 'selected' : ''}>Zama</option><option value="Abdulkarim" ${allFilter === 'Abdulkarim' ? 'selected' : ''}>Abdulkarim</option><option value="bookmarked" ${allFilter === 'bookmarked' ? 'selected' : ''}>Bookmarked</option></select></div><div class="question-list">${filtered.length ? filtered.map((q) => `<button class="question-row" data-action="open-question" data-id="${q.id}"><span class="row-number">${escapeHtml(q.label)}<br /><small>${escapeHtml(q.part)} · ${escapeHtml(q.group)}</small></span><span class="row-content"><strong>${escapeHtml(q.text)}</strong><span>Source page ${escapeHtml(q.sourcePage)} · ${escapeHtml(q.kind)}${q.flags?.length ? ' · flagged' : ''}</span></span><span class="row-mark">${isBookmarked(q.id) ? '★' : '›'}</span></button>`).join('') : '<article class="card empty-state"><h2>No matches.</h2><p>Try a broader keyword or clear the filter.</p></article>'}</div>`;
}

function render() {
  if (!questions.length) return;
  renderTop();
  const app = document.querySelector('#app');
  app.innerHTML = view === 'home' ? renderHome() : view === 'learn' ? renderLearn() : view === 'revision' ? renderRevision() : renderAllQuestions();
  bindDynamicInputs();
}

function bindDynamicInputs() {
  const search = document.querySelector('#all-search');
  if (search) search.addEventListener('input', (event) => { allQuery = event.target.value; render(); const next = document.querySelector('#all-search'); next?.focus(); next?.setSelectionRange(allQuery.length, allQuery.length); });
  const filter = document.querySelector('#all-filter');
  if (filter) filter.addEventListener('change', (event) => { allFilter = event.target.value; render(); });
  document.querySelectorAll('input[type="radio"]').forEach((input) => input.addEventListener('change', (event) => {
    if (activeRevision && view === 'revision' && !activeRevision.done) activeRevision.selected = event.target.value;
    else learnSession.selected = event.target.value;
  }));
}

function handleSubmitAnswer() {
  const question = currentQuestion();
  if (!learnSession.selected) return showToast('Choose an answer first.');
  learnSession.submitted = true;
  markStudied(question, learnSession.selected);
  render();
}

function handleShowAnswer() {
  const question = currentQuestion();
  learnSession.revealed = true;
  markStudied(question, null);
  render();
}

function handleNextQuestion() {
  learnIndex = (learnIndex + 1) % questions.length;
  learnSession = { selected: null, submitted: false, revealed: false };
  state.currentIndex = learnIndex;
  saveState();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function startRevision(testId) {
  const test = state.revisionTests.find((item) => item.id === testId);
  if (!test) return;
  activeRevision = { testId, questionIds: test.questionIds, index: 0, selected: null, submitted: false, answers: {}, done: false };
  view = 'revision';
  render();
}

function submitRevision() {
  const test = state.revisionTests.find((item) => item.id === activeRevision.testId);
  const question = questions.find((item) => item.id === test.questionIds[activeRevision.index]);
  if (!activeRevision.selected) return showToast('Choose an answer first.');
  activeRevision.answers[question.id] = activeRevision.selected;
  activeRevision.submitted = true;
  if (activeRevision.index < test.questionIds.length - 1) {
    activeRevision.index += 1;
    activeRevision.selected = null;
    activeRevision.submitted = false;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  const score = test.questionIds.reduce((sum, id) => sum + (activeRevision.answers[id] === questions.find((q) => q.id === id).answer ? 1 : 0), 0);
  const attempt = { score, total: test.questionIds.length, answers: activeRevision.answers, completedAt: new Date().toISOString() };
  state.revisionAttempts[test.id] = [...(state.revisionAttempts[test.id] || []), attempt];
  saveState();
  activeRevision.done = true;
  activeRevision.result = attempt;
  render();
}

function retryRevision() {
  const testId = activeRevision.testId;
  startRevision(testId);
}

document.addEventListener('click', (event) => {
  const nav = event.target.closest('[data-view]');
  if (nav) { setView(nav.dataset.view); return; }
  const action = event.target.closest('[data-action]');
  if (!action) return;
  const name = action.dataset.action;
  if (name === 'continue-learning') { learnIndex = nextIncompleteIndex(); learnSession = { selected: null, submitted: false, revealed: false }; setView('learn'); }
  if (name === 'toggle-bookmark') toggleBookmark(action.dataset.id);
  if (name === 'submit-answer') handleSubmitAnswer();
  if (name === 'show-answer') handleShowAnswer();
  if (name === 'next-question') handleNextQuestion();
  if (name === 'start-revision') startRevision(action.dataset.id);
  if (name === 'submit-revision') submitRevision();
  if (name === 'retry-revision') retryRevision();
  if (name === 'back-to-revision') { activeRevision = null; setView('revision'); }
  if (name === 'open-question') {
    const index = questions.findIndex((q) => q.id === action.dataset.id);
    if (index >= 0) { learnIndex = index; learnSession = { selected: null, submitted: false, revealed: false }; setView('learn'); }
  }
});

function boot(payload) {
    dataset = payload;
    questions = payload.questions;
    const sourceChip = document.querySelector('#source-chip-text');
    if (sourceChip) sourceChip.textContent = `${payload.source.usableOccurrences} visible occurrences loaded`;
    learnIndex = Math.min(state.currentIndex || 0, questions.length - 1);
    render();
}

if (window.BIOLEARN_DATA) {
  boot(window.BIOLEARN_DATA);
} else {
  fetch('/data/questions.json')
    .then((response) => response.json())
    .then(boot)
    .catch(() => {
      document.querySelector('#app').innerHTML = '<article class="card empty-state"><h2>Question bank unavailable.</h2><p>Open BioLearn.html directly or run the optional local preview server.</p></article>';
    });
}

</script>
  </body>
</html>
